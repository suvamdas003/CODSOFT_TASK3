# Optional reverse proxy for CareerHub (docker compose --profile proxy up -d).
# Terminate TLS in front of this (load balancer / ingress) or extend with a
# `listen 8443 ssl` server block and mounted certificates.

upstream careerhub_app {
  server app:3000;
  keepalive 16;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;

  # Resumes are capped at 5 MB by the app; leave headroom for multipart overhead.
  client_max_body_size 8m;

  location / {
    proxy_pass http://careerhub_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Preserve the public host (incl. port) so Server Actions' origin check passes.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
  }
}
